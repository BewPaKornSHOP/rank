<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โพเดี้ยม BewPaKornSHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;font-family:'Kanit',Arial,sans-serif;overflow:hidden}
.pd-wrap{
  background:url('bg.png') center top/cover no-repeat;
  border-radius:12px;
  padding:8px 16px 0;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  max-height:220px;
}
.pd-wrap::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,0.45);z-index:0}
.pd-inner{position:relative;z-index:1}
.pd-title{text-align:center;margin-bottom:10px}
.pd-title h2{color:#fff;font-size:15px;font-weight:800;text-shadow:0 2px 6px rgba(0,0,0,0.4)}
.pd-title p{color:rgba(255,255,255,0.8);font-size:11px;margin-top:2px}
.pd-stage{display:flex;align-items:flex-end;justify-content:center;gap:12px}
.pd-card{display:flex;flex-direction:column;align-items:center;gap:3px}
.pd-crown{font-size:22px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5))}
.pd-name{color:#fff;font-weight:700;font-size:11px;text-align:center;max-width:90px;word-break:break-all;text-shadow:0 1px 3px rgba(0,0,0,0.5)}
.pd-badge{font-size:9px;padding:2px 7px;border-radius:20px;font-weight:700;color:#fff}
.pd-amt{color:rgba(255,255,255,0.95);font-size:11px;font-weight:700}
.pd-block{display:none}
.pb1{height:0}
.pb2{height:0}
.pb3{height:0}
.pd-btn{
  display:block;
  text-align:center;
  background:rgba(255,255,255,0.15);
  color:#fff;
  font-family:'Kanit',sans-serif;
  font-size:12px;
  font-weight:600;
  padding:7px;
  border-top:1px solid rgba(255,255,255,0.2);
  text-decoration:none;
  transition:background .2s;
  position:relative;
  z-index:2;
  margin-top:10px;
}
.pd-btn:hover{background:rgba(255,255,255,0.25)}
.pd-loading{color:rgba(255,255,255,0.7);text-align:center;padding:20px;position:relative;z-index:1;font-size:13px}
</style>
</head>
<body>
<canvas id="fx" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:3"></canvas>
<script>
(function(){
var c=document.getElementById('fx');
var ctx=c.getContext('2d');
function resize(){c.width=c.offsetWidth;c.height=c.offsetHeight;}
resize();

// หิมะ
var flakes=[];
for(var i=0;i<60;i++){
  flakes.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*2+1,speed:Math.random()*1+0.3,wind:Math.random()*0.4-0.2,op:Math.random()*0.5+0.3});
}

// ไฟฟ้าสีเขียว
var bolts=[];
function newBolt(){
  return{x:Math.random()*c.width,y:0,life:0,maxLife:8+Math.random()*8,segs:[]};
}
function makeBolt(b){
  b.segs=[];
  var x=b.x,y=0;
  while(y<c.height*0.7){
    var nx=x+(Math.random()*40-20);
    var ny=y+(Math.random()*30+10);
    b.segs.push({x1:x,y1:y,x2:nx,y2:ny});
    x=nx;y=ny;
  }
}
for(var i=0;i<3;i++){
  var b=newBolt();
  makeBolt(b);
  bolts.push(b);
}

function draw(){
  ctx.clearRect(0,0,c.width,c.height);

  // วาดหิมะ
  flakes.forEach(function(f){
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,'+f.op+')';
    ctx.fill();
    f.y+=f.speed;f.x+=f.wind;
    if(f.y>c.height){f.y=0;f.x=Math.random()*c.width;}
    if(f.x>c.width)f.x=0;
    if(f.x<0)f.x=c.width;
  });

  // วาดไฟฟ้า
  bolts.forEach(function(b){
    b.life++;
    var alpha=b.life<b.maxLife/2?(b.life/(b.maxLife/2)):((b.maxLife-b.life)/(b.maxLife/2));
    alpha=Math.max(0,Math.min(1,alpha));
    b.segs.forEach(function(s){
      ctx.beginPath();
      ctx.moveTo(s.x1,s.y1);
      ctx.lineTo(s.x2,s.y2);
      ctx.strokeStyle='rgba(0,255,80,'+alpha+')';
      ctx.lineWidth=1.5;
      ctx.shadowColor='#00ff50';
      ctx.shadowBlur=8;
      ctx.stroke();
      ctx.shadowBlur=0;
    });
    if(b.life>=b.maxLife){
      b.x=Math.random()*c.width;
      b.life=0;
      b.maxLife=8+Math.random()*8;
      makeBolt(b);
    }
  });

  requestAnimationFrame(draw);
}
draw();
})();
</script>
<div class="pd-wrap" onclick="window.top.location.href='https://bewpakornshop.github.io/rank/'">
  <div class="pd-inner">
    <div class="pd-title">
      <h2>🏆 แรงค์ลูกค้าผู้เติมเงินสูงสุด</h2>
      <p>จัดลำดับลูกค้าที่เติมเงินสูงสุดของร้าน BewPaKornSHOP ในเดือนนี้</p>
    </div>
    <div class="pd-stage" id="stage"><div class="pd-loading">กำลังโหลด...</div></div>
  </div>
  <a class="pd-btn" href="https://bewpakornshop.github.io/rank/" target="_top">🏅 คลิกดูลำดับอื่นเพิ่มเติม →</a>
</div>
<script>
const SHEET_ID='1GeZ_52gYPnFhJfZxR7azH_t4ayBpg7H2PIWcm9Fo8I0';
const SHEET_NAME='ยอดรวม';
const URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
function tier(a){
  if(a>=100001)return{l:'⚡ รวยพระเจ้า',bg:'#7b1fa2'};
  if(a>=50001)return{l:'🔱 อีลีท',bg:'#b71c1c'};
  if(a>=30001)return{l:'🏆 มหาเศรษฐี',bg:'#e65100'};
  if(a>=10001)return{l:'👑 ท่านเจ้าสัว',bg:'#4a148c'};
  if(a>=5001)return{l:'🦁 ลูกเจ้าสัว',bg:'#bf360c'};
  if(a>=1001)return{l:'💎 เสี่ยรายใหญ่',bg:'#0d47a1'};
  if(a>=501)return{l:'💰 เสี่ย',bg:'#e65100'};
  if(a>=101)return{l:'⭐ พี่ลูกค้า',bg:'#1565c0'};
  return{l:'🌱 คุณลูกค้า',bg:'#2e7d32'};
}
fetch(URL).then(r=>r.text()).then(txt=>{
  const json=JSON.parse(txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\);/)[1]);
  const data=json.table.rows
    .filter(r=>r.c[1]?.v&&r.c[2]?.v)
    .map(r=>({name:String(r.c[1].v).trim(),amt:Math.round(r.c[2].v)}))
    .filter(m=>m.name&&m.amt>0)
    .sort((a,b)=>b.amt-a.amt)
    .slice(0,3);
  const slots=[
    {d:data[1],crown:'🥈',blk:'pb2',num:2,o:1},
    {d:data[0],crown:'🥇',blk:'pb1',num:1,o:2},
    {d:data[2],crown:'🥉',blk:'pb3',num:3,o:3}
  ];
  document.getElementById('stage').innerHTML=slots.map(s=>{
    if(!s.d)return'';
    const t=tier(s.d.amt);
    return`<div class="pd-card" style="order:${s.o}">
      <div class="pd-crown">${s.crown}</div>
      <div class="pd-name">${s.d.name}</div>
      <div class="pd-badge" style="background:${t.bg}">${t.l}</div>
      <div class="pd-amt">${s.d.amt.toLocaleString()} บาท</div>
      <div class="pd-block ${s.blk}">${s.num}</div>
    </div>`;
  }).join('');
}).catch(()=>{
  document.getElementById('stage').innerHTML='<span style="color:rgba(255,255,255,0.6)">โหลดข้อมูลไม่ได้</span>';
});
</script>
</body>
</html>
